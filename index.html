<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
<link rel="stylesheet" href="./styles/style.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-content">

      <div class="auth-hero">
        <div class="brand"><span class="dot"></span>ASSESS.IO</div>
        <h1>JOIN THE PORTAL</h1>
        <p class="tagline">Where Your Next Role Begins.</p>
        <p class="description">Create your account to start the assessment and pick up right where you left off, on any device.</p>
      </div>

      <!-- The frosted-glass form card -->
      <div class="auth-card">
        <h1>Create your account</h1>
        <p class="subtitle">Fill in your details to get started.</p>

        <div class="alert" id="signupAlert"></div>

        <form id="signupForm" novalidate>

          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. John Doe" autocomplete="name">
            <span class="field-error" id="nameError"></span>
          </div>

          <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" placeholder="e.g. 25" min="1" max="120">
            <span class="field-error" id="ageError"></span>
          </div>

          <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" placeholder="e.g. 123 Main Street, City" autocomplete="street-address">
            <span class="field-error" id="addressError"></span>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="e.g. john@example.com" autocomplete="email">
            <span class="field-error" id="emailError"></span>
          </div>

          <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" placeholder="Enter Your Mobile Number">
            <span class="field-error" id="mobileError"></span>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password">
            <span class="field-error" id="passwordError"></span>
          </div>

          <button type="submit" class="btn btn-primary" id="signupSubmitBtn">Create Account</button>
        </form>

        <p class="auth-footer">Already have an account? <a href="templates/login.html">Log In</a></p>
      </div>

    </div>
  </div>

  <script src="./static/js/script.js"></script>
</body>
</html>
