<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>

  <link rel="stylesheet" href="{{ url_for('styles', filename='style.css') }}">
</head>
<body>
  <div class="auth-page">
    <div class="auth-content">
      <div class="auth-hero">
        <div class="brand"><span class="dot"></span>ASSESS.IO</div>
        <h1>WELCOME BACK</h1>
        <p class="tagline">Pick Up Right Where You Left Off.</p>
        <p class="description">Log in to reach your dashboard and continue your assessment.</p>
      </div>

      <div class="auth-card">
        <h1>Log in</h1>
        <p class="subtitle">Enter your details to access your dashboard.</p>

        <div class="alert" id="loginAlert"></div>

        <form id="loginForm" novalidate>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="off">
            <span class="field-error" id="emailError"></span>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="off">
            <span class="field-error" id="passwordError"></span>
          </div>

          <p class="form-links"><a href="#">Forgot password?</a></p>

          <button type="submit" class="btn btn-primary" id="loginSubmitBtn">Sign In</button>
        </form>

        <div class="divider">or</div>

        <button type="button" class="btn-google">Sign in with Google</button>

        <p class="auth-footer">New here? <a href="/signup">Create an Account</a></p>
      </div>

    </div>
  </div>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
