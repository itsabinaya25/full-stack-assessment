
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>

  <link rel="stylesheet" href="{{ url_for('styles', filename='style.css') }}">
</head>

<body>

  <div class="auth-page">
    <div class="auth-content">

      <div class="auth-hero">
        <div class="brand"><span class="dot"></span>ASSESS.IO</div>

        <h1>RESET PASSWORD</h1>

        <p class="tagline">Create A New Password.</p>

        <p class="description">
          Enter your registered email and choose a new password.
        </p>
      </div>

      <div class="auth-card">

        <h1>Forgot Password</h1>

        <p class="subtitle">
          Enter your email and new password.
        </p>

        <div class="alert" id="forgotAlert"></div>

        <form id="forgotPasswordForm" novalidate>

          <div class="form-group">
            <label for="forgotEmail">Email</label>

            <input
              type="email"
              id="forgotEmail"
              name="email"
              placeholder="Enter your registered email"
              autocomplete="off"
            >

            <span class="field-error" id="forgotEmailError"></span>
          </div>

          <div class="form-group">
            <label for="newPassword">New Password</label>

            <input
              type="password"
              id="newPassword"
              name="newPassword"
              placeholder="Enter your new password"
            >

            <span class="field-error" id="newPasswordError"></span>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>

            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm your new password"
            >

            <span class="field-error" id="confirmPasswordError"></span>
          </div>

          <button
            type="submit"
            class="btn btn-primary"
            id="forgotPasswordBtn"
          >
            Reset Password
          </button>

        </form>

        <p class="auth-footer">
          Remember your password?
          <a href="/login">Back to Login</a>
        </p>

      </div>

    </div>
  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
